name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build .NET Framework 4.8 Release
        run: ./build.ps1 -Configuration Release

      - name: Package and validate version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/Package-Release.ps1 -Tag $env:RELEASE_TAG

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: XwRemote-NG-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = @"
          Requires .NET Framework 4.8 and Microsoft Edge WebView2 Evergreen Runtime.
          Extract the entire ZIP, including native DLL subdirectories.
          Windows Server 2016 runtime acceptance remains pending.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          $assets = @(Get-ChildItem artifacts -File | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "XwRemote NG $env:RELEASE_TAG" --notes-file $notesPath --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are not overwritten.' }
